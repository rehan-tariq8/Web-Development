<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #183B4E;
            margin: 0;
            padding: 0;
        }

        .parent {
            background-color: rgb(3, 180, 250);
            height: 250px;
            margin: 0;
            padding: 100px;
        }

        .login {
            display: flex;
            justify-content: center;
        }

        .textCard {
            padding: 0%;
            margin: 0%;
            color: white;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to left, #16aef0, #65c7f1);
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            display: flex;
            width: 400px;
            padding: 40px;
            text-align: left;
            border-radius: 7px;
        }

        .textCard i {
            display: flex;
            gap: 10px;
            padding-right: 10px;
        }

        .textCard svg {
            transform: rotate(-20deg);
        }

        h1 {
            font-weight: bolder;
            padding: 10px;
            text-align: start;
        }

        h2 {
            font-weight: normal;
        }

        .form {
            text-align: left;
            padding: 40px;
            width: 400px;
            background-color: #183B4E;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
        }

        .formHeadings {
            font-family: 'Times New Roman', Times, serif;
            color: white;
        }

        .fields {
            position: relative;
            margin-bottom: 6px;
            color: white;
        }

        .fields i {
            position: absolute;
            top: 20%;
            right: 10px;
            transform: translateX(-380%);
            font-size: 16px;
        }

        .fields input {
            width: 80%;
            padding: 8px;
            border-radius: 5px;
            border-color: white;
            margin-bottom: 15px;
            background-color: #183B4E;
        }

        .link {
            text-decoration: none;
        }

        .link a {
            color: white;
            font-family: 'Times New Roman', Times, serif;
        }

        input[type="submit"] {
            width: 100%;
            border: none;
            color: white;
            background-color: rgb(4, 183, 253);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: rgb(18, 170, 230);
        }

        .socialButtons {
            display: flex;
            flex-direction: row;
            margin-top: 10px;
            gap: 45px;
        }

        .socialButtons button {
            padding: 8px;
            width: 30%;
            border-radius: 6px;
            border: none;
            background-color: #183B4E;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
        }

        button:hover {
            background-color: #1d6185;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="login">
            <div class="textCard">
                <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 576 512">
                    <path fill="currentColor"
                        d="M576 240c0-23.63-12.95-44.04-32-55.12V32.01C544 23.26 537.02 0 512 0c-7.12 0-14.19 2.38-19.98 7.02l-85.03 68.03C364.28 109.19 310.66 128 256 128H64c-35.35 0-64 28.65-64 64v96c0 35.35 28.65 64 64 64h33.7c-1.39 10.48-2.18 21.14-2.18 32c0 39.77 9.26 77.35 25.56 110.94c5.19 10.69 16.52 17.06 28.4 17.06h74.28c26.05 0 41.69-29.84 25.9-50.56c-16.4-21.52-26.15-48.36-26.15-77.44c0-11.11 1.62-21.79 4.41-32H256c54.66 0 108.28 18.81 150.98 52.95l85.03 68.03a32.023 32.023 0 0 0 19.98 7.02c24.92 0 32-22.78 32-32V295.13C563.05 284.04 576 263.63 576 240zm-96 141.42l-33.05-26.44C392.95 311.78 325.12 288 256 288v-96c69.12 0 136.95-23.78 190.95-66.98L480 98.58v282.84z" />
                </svg>
                <h1>Digital</h1>
                <h2>Marketing</h2>
            </div>
            <div class="form">
                <form action="#" method="post">
                    <div class="formHeadings">
                        <h1>Welcome Digital</h1>
                        <h5 style="color: rgba(219, 206, 206, 0.909);">Sign in to continue Digital Marketing.</h5>
                    </div>
                    <div class="fields">
                        <input type="email" name="mail" id="mail" placeholder="Enter Username" required
                            autocomplete="off">
                        <i class="glyphicon glyphicon-user"></i>
                    </div>
                    <div class="fields">
                        <input type="password" name="pass" id="pass" placeholder="Enter Password" required>
                        <i class="glyphicon glyphicon-lock"></i>
                    </div>
                    <div class="link">
                        <p><a href="#">Forgot Password?</a></p>
                    </div>
                    <div class="button">
                        <input type="submit" value="Sign in">
                    </div>
                    <div class="socialButtons">
                        <button class="google"><i class="fab fa-google"></i>Sign In</button>
                        <button class="twitter"><i class="fab fa-twitter"></i>Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
